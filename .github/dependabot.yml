version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps are migrations, not maintenance; they break CI on a frozen submission.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned on purpose: every number in the evidence was measured on relate-db 1.0.1. Bump it by hand and re-measure.
      - dependency-name: "relate-db"
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/setup-relate"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
