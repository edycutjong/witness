name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DO_NOT_TRACK: '1'   # Relate telemetry is on by default

jobs:
  # ── STAGE 1: Quality (parallel with Stage 2) ──────────────
  quality:
    name: "Stage 1 · Quality (py${{ matrix.python }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range on main, one interpreter on PRs
        python: ${{ github.event_name == 'push' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: ./.github/actions/setup-relate
      - name: Install
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .
      - name: Typecheck (mypy)
        run: uv run mypy src --ignore-missing-imports
      - name: Tests + 100% coverage gate (real Relate, no mocks)
        run: uv run pytest --cov=witness --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # ── STAGE 2: Security (parallel with Stage 1) ─────────────
  secret-scan:
    name: "Stage 2 · Secret scan (gitleaks, full history)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read   # the action lists a PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: "Stage 2 · Dependency audit (pip-audit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - name: pip-audit
        run: uv run pip-audit --skip-editable

  # ── STAGE 3: Build ────────────────────────────────────────
  build:
    name: "Stage 3 · Build (wheel, sdist, site)"
    needs: [quality, secret-scan, dependency-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - name: Build wheel + sdist
        run: uv build
      - name: Installed wheel starts
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/witness --version
      - name: Site and JUDGE.md are in sync with the committed evidence
        run: |
          uv run python scripts/build_site.py
          git diff --exit-code -- site JUDGE.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── STAGE 4: E2E (the judge's path, from the built wheel) ─
  e2e:
    name: "Stage 4 · E2E (fresh install, demo, Relate CLI re-run, site)"
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-relate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - name: witness demo from the built wheel
        run: |
          uv venv /tmp/e2e
          uv pip install --python /tmp/e2e/bin/python "$(ls dist/*.whl)[mcp]"
          /tmp/e2e/bin/witness demo --out /tmp/e2e-out | tee /tmp/demo.txt
          grep -q "22 of 22 change the answer" /tmp/demo.txt
      - name: Relate CLI re-runs the committed witness (plain relate, no witness code)
        run: |
          relate query --database witnesses/two-hub.rl --read-only --param country=MX --param dest=MEX \
            < queries/two-hub.cypher | tee /tmp/relate-out.txt
          grep -q UPN /tmp/relate-out.txt
      - name: Landing, exhibit and /judge answer with no credentials
        run: |
          python3 -m http.server 8765 --directory site >/dev/null 2>&1 &
          sleep 1
          for p in / /judge/ /exhibit/two-hub.html; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8765$p")" = 200
          done
          # the claim the generator writes, with N read from the committed manifest (tests/test_committed.py keeps
          # every literal grep below in step with the committed site)
          N=$(python3 -c "import json; print(json.load(open('witnesses/two-hub.manifest.json'))['witness']['relationships'])")
          curl -s http://127.0.0.1:8765/judge/ | grep -q "$N of $N change the answer"
          curl -s http://127.0.0.1:8765/ | grep -q 'id="ver"'

  # ── STAGE 5: Performance ──────────────────────────────────
  performance:
    name: "Stage 5 · Performance (reduction throughput floor)"
    needs: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: ./.github/actions/setup-relate
      - run: uv sync --locked
      - run: uv run python scripts/perf_gate.py

  # ── STAGE 6: Deploy Gate ──────────────────────────────────
  deploy-gate:
    name: "Stage 6 · Deploy Gate"
    needs: [quality, secret-scan, dependency-audit, build, e2e, performance]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every stage must have succeeded
        run: |
          echo '${{ toJSON(needs) }}' | tee /tmp/needs.json
          if grep -q '"result": "\(failure\|cancelled\|skipped\)"' /tmp/needs.json; then
            echo "::error::a stage did not pass; do not deploy"; exit 1
          fi
          echo "All six stages passed. The Vercel site is deployed from the committed site/ directory by the owner." >> "$GITHUB_STEP_SUMMARY"
