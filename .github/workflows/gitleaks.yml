name: gitleaks

# Stage 2 of ci.yml already scans the full history on every push and PR. This workflow re-scans the whole history weekly
# (new rules, old commits) and on demand, e.g. right before the repository goes public.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the point is to scan the past
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
