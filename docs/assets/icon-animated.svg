<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Witness — reduces a graph to its witness. Thousands of graphite lines fade; a handful stay, each tagged with a red exhibit number; the answer above never moves.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-8%    steady state: the mark as filed: manila plate, red kept relationship between two ink nodes, red exhibit tag on its string, dashed graphite ghosts (poster = brand)
  8-24%   trigger:      the tag lifts away and the kept line returns to graphite; six more graphite relationships draw in: the whole graph, unproven      data-story="beat-2"
  24-50%  mechanism:    Thousands of graphite lines fade; a handful stay, each tagged with a red exhibit number; the answer above never moves.      data-story="beat-3"
  50-66%  resolution:   the red line is drawn back in; the tag swings in on its string and settles at its filed angle                       data-story="beat-4"
  66-100% breathe:      a red glow breathes behind the kept line and tag; the state now equals frame 0, so the seam needs no cut
-->
<title>Witness</title>
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="tagshadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1F1A14" flood-opacity="0.18"/></filter>
</defs>
<style>
  .swing{transform-box:view-box;transform-origin:289px 294px;animation:swing 6s cubic-bezier(.2,1.4,.4,1) infinite}
  @keyframes swing{0%,8%{transform:rotate(0deg)}12%,50%{transform:rotate(-38deg)}58%{transform:rotate(6deg)}63%{transform:rotate(-3deg)}68%,100%{transform:rotate(0deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
