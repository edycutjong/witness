[project]
name = "witness"
version = "0.1.0"
description = "Shrink a graph answer to the few relationships it needs, and prove each one is needed. Built on Relate."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "relate-db==1.2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
witness = "witness.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mcp>=2.3,<3",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["fixtures"]  # generated fixture tests keep the whole statement + expected rows on one line

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_site.py" = ["E501"]  # the inline HTML/CSS template of the landing page
"src/witness/export.py" = ["E501"]  # the inline HTML/CSS template of the exhibit view

[tool.coverage.run]
source = ["witness"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
